<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respond</title>
<style>
  :root {
    --paper: #f7f6f2; --ink: #1c1b18; --mute: #6f6c64; --line: #d9d6cd; --panel: #ffffff;
    --ok: #2ea36b; --bad: #e0523f; --accent: #2f7fd6;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #171614; --ink: #ecebe6; --mute: #9b988e; --line: #34322d; --panel: #211f1c;
  } }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; } body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.45 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
  p { margin: 6px 0; } .mute { color: var(--mute); }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; }
  textarea { min-height: 72px; resize: vertical; }
  label { display: block; font-size: 14px; color: var(--mute); margin: 10px 0 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }
  .code { font-size: 44px; font-weight: 600; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  .clock { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sq { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 2px; }
  .roster { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .roster .off { opacity: .4; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; margin: 8px 0; font-size: 18px; border-radius: 10px; border: 2px solid var(--line); }
  .opt.mine { border-color: var(--ink); }
  .opt.key { border-color: var(--ok); }
  .opt .bar { height: 8px; border-radius: 4px; background: var(--ink); opacity: .8; }
  .opt .sqs { margin-left: auto; display: flex; gap: 2px; }
  .tabs { display: flex; gap: 6px; } .tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  canvas { width: 100%; touch-action: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: block; }
  .hidden { display: none !important; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  input[type=range] { padding: 0; }
  .refused { color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="/shared/engine.js"></script>
<script>
// ---------------------------------------------------------------- client core
const app = document.getElementById('app');
let ws = null, me = null, state = Engine.initState(), log = null, replayAt = null;
let hello = null, refusedNote = '';
let live = { hover: null, drag: null };  // local UI state

function connect(h) {
  hello = h;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', ...h }));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'welcome') { me = { id: m.id, role: m.role, room: m.room }; state = m.state; hello.room = m.room; render(); }
    else if (m.type === 'op') { if (m.op.seq > state.seq) Engine.reduce(state, m.op); render(); }
    else if (m.type === 'snapshot') { state = m.state; render(); }
    else if (m.type === 'log') { log = m.log; replayAt = log.length; render(); }
    else if (m.type === 'refused') { refusedNote = 'That action is not allowed right now.'; render(); setTimeout(() => { refusedNote = ''; render(); }, 1500); }
    else if (m.type === 'error') { alert(m.message); ws.close(); me = null; hello = null; render(); }
  };
  ws.onclose = () => { if (hello) setTimeout(() => connect(hello), 1500); };
}
function op(type, payload) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'op', op: { type, payload } })); }
function select(node) { op('select', { node }); }
const user = id => state.users[id] || { name: '?', color: '#999' };
const sq = (id, big) => `<span class="sq" style="background:${user(id).color};${big ? 'width:18px;height:18px;' : ''}" title="${esc(user(id).name)}"></span>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const h = (strings, ...vals) => strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), '');
function el(html) { app.innerHTML = html; }
setInterval(() => { if (state.phase.status === 'open' && state.phase.closesAt) render(); }, 250);

// -------------------------------------------------------------------- render
function render() {
  if (!me) return renderLanding();
  const s = replayAt != null && log ? Engine.replay(log, replayAt) : state;
  if (me.role === 'presenter') renderPresenter(s); else renderParticipant(s);
}

function renderLanding() {
  el(h`
    <h1>Respond</h1>
    <p class="mute">Real-time activities for a room of people.</p>
    <div class="panel">
      <h2 style="margin-top:0">Join a room</h2>
      <label>Room code</label><input id="jcode" maxlength="4" style="text-transform:uppercase" autocomplete="off">
      <label>Your name</label><input id="jname" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="primary" id="join">Join</button></div>
    </div>
    <div class="panel">
      <h2 style="margin-top:0">Run a room</h2>
      <p class="mute">Creates a new room code for participants to join.</p>
      <div class="row" style="margin-top:12px"><button id="host">Start a room as presenter</button></div>
    </div>`);
  const q = new URLSearchParams(location.search);
  if (q.get('room')) document.getElementById('jcode').value = q.get('room');
  document.getElementById('join').onclick = () => {
    const room = document.getElementById('jcode').value.trim(), name = document.getElementById('jname').value.trim();
    if (room.length !== 4 || !name) return alert('Enter the 4-letter room code and your name.');
    connect({ role: 'participant', room, name });
  };
  document.getElementById('host').onclick = () => connect({ role: 'presenter', room: null, name: 'Presenter' });
}

function phaseLine(s) {
  const ph = s.phase;
  if (ph.status === 'open') {
    const left = ph.closesAt ? Math.max(0, Math.ceil((ph.closesAt - Date.now()) / 1000)) : null;
    return h`<span class="clock">${left == null ? 'Open' : left + 's'}</span> <span class="mute">${ph.sealed ? 'responses hidden until close' : 'responses shown live'}</span>`;
  }
  if (ph.status === 'closed') return h`<span class="clock">Closed</span>`;
  return h`<span class="mute">Not started</span>`;
}

function rosterHtml(s, withSel) {
  const ids = Object.keys(s.users).filter(id => s.users[id].role === 'participant');
  if (!ids.length) return '<p class="mute">No one has joined yet.</p>';
  return '<div class="roster">' + ids.map(id => h`<span class="${s.users[id].online ? '' : 'off'}">${sq(id)} ${esc(s.users[id].name)}${withSel && s.presence[id] ? '<span class="mute"> · ' + esc(s.presence[id].node) + '</span>' : ''}</span>`).join('') + '</div>';
}

// ------------------------------------------------------------------ presenter
let setupKind = 'mcq';
function renderPresenter(s) {
  const a = s.activity && Engine.activities[s.activity];
  el(h`
    <div class="row" style="justify-content:space-between">
      <div><h1>Room</h1><div class="code">${me.room}</div><p class="mute">Join at ${location.host}?room=${me.room}</p></div>
      <div style="text-align:right">${phaseLine(s)}</div>
    </div>
    <h2>Participants</h2>${rosterHtml(s, true)}
    <div id="setup"></div>
    <div id="stage"></div>
    <div id="replay"></div>`);

  const setup = document.getElementById('setup');
  if (!a) {
    setup.innerHTML = h`
      <h2>New activity</h2>
      <div class="tabs">${Object.values(Engine.activities).map(x => h`<button data-k="${x.kind}" class="${setupKind === x.kind ? 'on' : ''}">${x.label}</button>`).join('')}</div>
      <div class="panel" id="form"></div>`;
    setup.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { setupKind = b.dataset.k; render(); });
    renderSetupForm(document.getElementById('form'));
    return;
  }

  const ph = s.phase;
  setup.innerHTML = h`
    <div class="panel row">
      <span><b>${a.label}</b></span>
      ${ph.status !== 'open' ? h`<label style="margin:0">Seconds</label><input id="secs" type="number" value="30" style="width:80px">
        <label style="margin:0;display:flex;align-items:center;gap:6px"><input id="sealed" type="checkbox" style="width:auto"> Hide until close</label>
        <button class="primary" id="open">${ph.status === 'closed' ? 'Reopen' : 'Open'}</button>` : h`<button class="primary" id="close">Close now</button>`}
      <button id="clear">End activity</button>
      <span class="refused">${refusedNote}</span>
    </div>`;
  const $ = id => document.getElementById(id);
  if ($('open')) $('open').onclick = () => op('open', { seconds: +$('secs').value || 0, sealed: $('sealed').checked });
  if ($('close')) $('close').onclick = () => op('close', {});
  $('clear').onclick = () => { if (confirm('End this activity?')) { log = null; replayAt = null; op('clear', {}); } };

  const stage = document.getElementById('stage');
  if (a.kind === 'mcq') stage.innerHTML = mcqHtml(s, null, true);
  if (a.kind === 'place') { stage.innerHTML = h`<p>${esc(s.doc.prompt)}</p><canvas id="board" width="800" height="800"></canvas>${placeResultsHtml(s)}`; drawBoard(s, document.getElementById('board'), null, true); }

  const rp = document.getElementById('replay');
  rp.innerHTML = h`<h2>Replay</h2>
    ${log ? h`<div class="row"><input type="range" id="scrub" min="0" max="${log.length}" value="${replayAt}" style="flex:1">
      <span class="mute" style="min-width:110px">op ${replayAt} / ${log.length}</span><button id="liveBtn">Back to live</button></div>
      <p class="mute">${replayAt > 0 ? opLine(log[replayAt - 1]) : 'Start'}</p>` : h`<button id="loadLog">Load the record</button>`}`;
  if ($('loadLog')) $('loadLog').onclick = () => ws.send(JSON.stringify({ type: 'log' }));
  if ($('scrub')) { $('scrub').oninput = e => { replayAt = +e.target.value; render(); }; $('liveBtn').onclick = () => { log = null; replayAt = null; render(); }; }
}
function opLine(o) {
  const u = user(o.actor);
  const p = o.type === 'answer' ? `chose ${String.fromCharCode(65 + o.payload.choice)}`
    : o.type === 'move' ? `moved ${o.payload.id} to (${o.payload.x.toFixed(1)}, ${o.payload.y.toFixed(1)})`
    : o.type === 'select' ? (o.payload.node ? `selected ${o.payload.node}` : 'released') : o.type;
  return `${new Date(o.t).toLocaleTimeString()} — ${esc(u.name)} ${esc(p)}`;
}

function renderSetupForm(form) {
  if (setupKind === 'mcq') {
    form.innerHTML = h`
      <label>Question</label><textarea id="q">Which vector is the sum of a and b?</textarea>
      <label>Options, one per line</label><textarea id="opts">a + b\na − b\nb − a\nneither</textarea>
      <label>Correct option letter (blank for a poll)</label><input id="key" value="A" style="width:80px">
      <div class="row" style="margin-top:12px"><button class="primary" id="load">Load activity</button></div>`;
    document.getElementById('load').onclick = () => {
      const options = document.getElementById('opts').value.split('\n').map(x => x.trim()).filter(Boolean);
      const k = document.getElementById('key').value.trim().toUpperCase();
      op('load', { kind: 'mcq', config: { question: document.getElementById('q').value, options, key: k ? k.charCodeAt(0) - 65 : null } });
    };
  } else {
    form.innerHTML = h`
      <label>Prompt</label><textarea id="p">Place R at the tip of a + b (a = (3, 1), b = (−1, 2)).</textarea>
      <label>Objects and their target positions — one per line: label x y</label><textarea id="t">R 2 3</textarea>
      <label>Grid range (±)</label><input id="r" type="number" value="5" style="width:80px">
      <label>Tolerance</label><input id="tol" type="number" step="0.1" value="0.5" style="width:80px">
      <label>Mode</label><select id="mode"><option value="shared">Shared board (first to grab an object may move it)</option><option value="individual">Individual boards (each participant places their own)</option></select>
      <div class="row" style="margin-top:12px"><button class="primary" id="load">Load activity</button></div>`;
    document.getElementById('load').onclick = () => {
      const objects = [], targets = {};
      document.getElementById('t').value.split('\n').forEach(line => {
        const [label, x, y] = line.trim().split(/\s+/); if (!label || isNaN(+x) || isNaN(+y)) return;
        objects.push({ id: label, label, x: 0, y: 0 }); targets[label] = { x: +x, y: +y };
      });
      if (!objects.length) return alert('Add at least one object line like: R 2 3');
      op('load', { kind: 'place', config: { prompt: document.getElementById('p').value, objects, targets, range: +document.getElementById('r').value || 5, tolerance: +document.getElementById('tol').value || 0.5, mode: document.getElementById('mode').value } });
    };
  }
}

// ---------------------------------------------------------------- participant
function renderParticipant(s) {
  const a = s.activity && Engine.activities[s.activity];
  el(h`
    <div class="row" style="justify-content:space-between"><div>${sq(me.id, true)} <b>${esc(user(me.id).name)}</b> <span class="mute">in ${me.room}</span></div><div>${phaseLine(s)}</div></div>
    <span class="refused">${refusedNote}</span>
    <div id="stage">${!a ? '<p class="mute" style="margin-top:40px">Waiting for the presenter to start an activity.</p>' : ''}</div>`);
  const stage = document.getElementById('stage');
  if (!a) return;
  if (a.kind === 'mcq') {
    stage.innerHTML = mcqHtml(s, me.id, false);
    stage.querySelectorAll('.opt').forEach(b => b.onclick = () => { select('option ' + b.dataset.i); op('answer', { choice: +b.dataset.i }); });
  }
  if (a.kind === 'place') {
    stage.innerHTML = h`<p>${esc(s.doc.prompt)}</p><canvas id="board" width="800" height="800"></canvas>${placeResultsHtml(s, me.id)}`;
    const c = document.getElementById('board'); drawBoard(s, c, me.id, false); bindBoard(c);
  }
}

// ---------------------------------------------------------------------- MCQ
function mcqHtml(s, viewerId, presenter) {
  const d = s.doc, total = Object.keys(d.answers).length || 1, closed = s.phase.status === 'closed';
  const showKey = closed && d.key != null;
  return h`<h2 style="margin-top:12px">${esc(d.question)}</h2>` + d.options.map((o, i) => {
    const who = Object.keys(d.answers).filter(id => d.answers[id] === i);
    const selecting = Engine.selectors(s, 'option ' + i).filter(id => !who.includes(id));
    const mine = viewerId && d.answers[viewerId] === i;
    const bar = presenter || closed || !s.phase.sealed ? h`<span class="bar" style="width:${(who.length / total) * 40}%"></span><span class="mute">${who.length}</span>` : '';
    return h`<button class="opt ${mine ? 'mine' : ''} ${showKey && d.key === i ? 'key' : ''}" data-i="${i}" ${!presenter && s.phase.status !== 'open' ? 'disabled' : ''}>
      <b>${String.fromCharCode(65 + i)}</b> <span>${esc(o)}</span> ${bar}
      <span class="sqs">${who.map(id => sq(id)).join('')}${selecting.map(id => `<span style="opacity:.4">${sq(id)}</span>`).join('')}</span></button>`;
  }).join('') + (closed && s.results && viewerId && s.results.perUser[viewerId] && s.results.perUser[viewerId].correct != null
    ? h`<p><b>${s.results.perUser[viewerId].correct ? 'Correct.' : 'Not this time.'}</b></p>` : '') +
    (presenter && closed ? h`<p class="mute">${Object.keys(d.answers).length} of ${Object.values(s.users).filter(u => u.role === 'participant').length} answered.</p>` : '');
}

// -------------------------------------------------------------------- Place
function boardMap(s, c) {
  const R = s.doc.range, W = c.width;
  return { toPx: p => ({ x: (p.x + R) / (2 * R) * W, y: (R - p.y) / (2 * R) * W }), toWorld: q => ({ x: q.x / W * 2 * R - R, y: R - q.y / W * 2 * R }), R, W };
}
function drawBoard(s, c, viewerId, presenter) {
  const ctx = c.getContext('2d'), m = boardMap(s, c), d = s.doc, act = Engine.activities.place;
  const cs = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = cs.getPropertyValue('--line'); ctx.lineWidth = 1;
  for (let i = -m.R; i <= m.R; i++) {
    const a = m.toPx({ x: i, y: -m.R }), b = m.toPx({ x: i, y: m.R });
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const c1 = m.toPx({ x: -m.R, y: i }), c2 = m.toPx({ x: m.R, y: i });
    ctx.beginPath(); ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y); ctx.stroke();
  }
  ctx.strokeStyle = cs.getPropertyValue('--mute'); ctx.lineWidth = 2;
  const o = m.toPx({ x: 0, y: 0 });
  ctx.beginPath(); ctx.moveTo(0, o.y); ctx.lineTo(c.width, o.y); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, c.height); ctx.stroke();

  const closed = s.phase.status === 'closed';
  if (closed) for (const id in d.targets) {   // show targets after close
    const t = m.toPx(d.targets[id]);
    ctx.strokeStyle = cs.getPropertyValue('--ok'); ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, d.tolerance / (2 * m.R) * m.W, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }

  // Which positions to draw: shared board, my copy, or (presenter, individual) everyone's copies.
  const sets = d.mode === 'shared' ? [{ pos: d.objects, who: null }]
    : presenter ? Object.keys(s.users).filter(id => s.users[id].role === 'participant').map(id => ({ pos: act.positions(s, id), who: id }))
    : [{ pos: act.positions(s, viewerId), who: viewerId }];
  ctx.font = '600 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const { pos, who } of sets) for (const id in pos) {
    const p = m.toPx(pos[id]); const r = d.mode === 'shared' ? 26 : 20;
    ctx.fillStyle = who ? user(who).color : cs.getPropertyValue('--panel'); ctx.strokeStyle = cs.getPropertyValue('--ink'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = who ? '#fff' : cs.getPropertyValue('--ink'); ctx.fillText(pos[id].label, p.x, p.y);
    if (d.mode === 'shared') {   // presence squares: holder first, then the queue
      const sel = Engine.selectors(s, id);
      sel.forEach((uid, k) => { ctx.fillStyle = user(uid).color; ctx.globalAlpha = k === 0 ? 1 : .45; roundRect(ctx, p.x + r + 4 + k * 16, p.y - r, 13, 13, 3); ctx.globalAlpha = 1; });
    }
  }
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function bindBoard(c) {
  const pt = ev => { const b = c.getBoundingClientRect(); return { x: (ev.clientX - b.left) / b.width * c.width, y: (ev.clientY - b.top) / b.height * c.height }; };
  c.onpointerdown = ev => {
    if (state.phase.status !== 'open') return;
    const m = boardMap(state, c), pos = Engine.activities.place.positions(state, me.id), q = pt(ev);
    for (const id in pos) if (Math.hypot(m.toPx(pos[id]).x - q.x, m.toPx(pos[id]).y - q.y) < 30) {
      live.drag = id; c.setPointerCapture(ev.pointerId); select(id); return;
    }
  };
  let last = 0;
  c.onpointermove = ev => {
    if (!live.drag) return;
    const m = boardMap(state, c), w = m.toWorld(pt(ev));
    const x = Math.max(-m.R, Math.min(m.R, w.x)), y = Math.max(-m.R, Math.min(m.R, w.y));
    if (Date.now() - last > 40) { last = Date.now(); op('move', { id: live.drag, x, y }); }
  };
  c.onpointerup = c.onpointercancel = ev => {
    if (!live.drag) return;
    const m = boardMap(state, c), w = m.toWorld(pt(ev));
    const snap = v => Math.round(Math.max(-m.R, Math.min(m.R, v)) * 2) / 2;   // half-unit snap on release
    op('move', { id: live.drag, x: snap(w.x), y: snap(w.y) });
    live.drag = null; select(null);
  };
}
function placeResultsHtml(s, viewerId) {
  if (s.phase.status !== 'closed' || !s.results) return '';
  const r = s.results;
  const line = sc => `${sc.hits} of ${sc.n} within tolerance` + Object.keys(sc.per).map(id => ` · ${id} off by ${sc.per[id].error.toFixed(2)}`).join('');
  if (r.board) return h`<p><b>${line(r.board)}</b></p>`;
  if (viewerId) return r.perUser[viewerId] ? h`<p><b>${line(r.perUser[viewerId])}</b></p>` : '';
  return '<table>' + Object.keys(r.perUser).map(id => h`<tr><td>${sq(id)} ${esc(user(id).name)}</td><td>${line(r.perUser[id])}</td></tr>`).join('') + '</table>';
}

render();
</script>
</body>
</html>
